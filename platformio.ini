; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy40]
platform = teensy@5.1.0
board = teensy40
framework = arduino

monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter


build_src_filter =
    -<*>
    +<main.cpp>
    +<outputs/DC_motors.cpp>
    +<comms/serial.cpp>
    +<comms/motor_control_comms.cpp>
    +<outputs/pickup_servo.cpp>
    +<outputs/collection.cpp>
    +<outputs/emag.cpp>
    +<inputs/tof_expander.cpp>
    +<logic_engine.cpp>
    +<state_machine.cpp>
    +<inputs/imu.cpp>
    +<driving_controller.cpp>
    +<navigator.cpp>

lib_deps = 
	adafruit/Adafruit TCS34725@^1.4.4
	arkhipenko/TaskScheduler@^4.0.8
    https://github.com/sparkfun/SparkFun_SX1509_Arduino_Library.git#V_2.0.1
    https://github.com/DFRobot/DFRobot_MatrixLidar.git
    https://github.com/bitcraze/Bitcraze_PMW3901.git
    https://github.com/cesarvandevelde/HerkulexServo.git
    rlogiacco/CircularBuffer @ ^1.3.3
    pololu/VL53L0X@^1.3.1
    pololu/VL53L1X@^1.3.1
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor
    Wire
    SPI


lib_ldf_mode = deep+
